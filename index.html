<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星眠小站">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>星眠小站 · 和夜晚温柔地打个卡</title>
<style>
/* 星眠小站 · 夜色渐晨 */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: #F7F3EA;
  background: linear-gradient(180deg, #16233F 0%, #2B3B63 38%, #6E6C9B 68%, #F3C9A0 88%, #FBE3C4 100%) fixed;
}
body.theme-deepnight { background: linear-gradient(180deg, #0E1730 0%, #1E2B4D 55%, #33436E 100%) fixed; }
body.theme-mist     { background: linear-gradient(180deg, #1E2148 0%, #4A4475 45%, #9C8FB5 75%, #E8D8D5 100%) fixed; }
body.theme-warm     { background: linear-gradient(180deg, #2B2748 0%, #6B5570 45%, #C98E7A 78%, #F6D7AE 100%) fixed; }
button, input, select { font-family: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.sky { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #FFF3D8; opacity: .65; animation: twinkle 5s ease-in-out infinite; }
.s1 { top: 9%; left: 14%; } .s2 { top: 17%; left: 62%; animation-delay: 1.1s; }
.s3 { top: 6%; left: 84%; animation-delay: 2.2s; } .s4 { top: 28%; left: 31%; animation-delay: .7s; }
.s5 { top: 34%; left: 91%; animation-delay: 1.8s; } .s6 { top: 43%; left: 8%; animation-delay: 3s; }
.s7 { top: 12%; left: 43%; animation-delay: 2.6s; } .s8 { top: 51%; left: 74%; animation-delay: 1.4s; }
.hero-moon { position: absolute; top: 48px; left: 20px; width: 30px; height: 30px; opacity: .82; filter: drop-shadow(0 0 12px rgba(255, 236, 197, .50)); }

.shell { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 14px) 18px 12px;
  background: rgba(17, 27, 52, .30); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #FFDCA9; box-shadow: 0 0 12px #FFDCA9; }
.topbar-right { font-size: 12px; color: #D5DDF0; }
.main { padding: 12px 16px calc(100px + env(safe-area-inset-bottom)); }

.ic { width: 16px; height: 16px; display: inline-block; vertical-align: middle; flex: none; }
.fade-in { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes twinkle { 0%, 100% { opacity: .28; } 50% { opacity: .85; } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

/* 主视觉 */
.hero {
  position: relative;
  background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .18);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 24px; padding: 16px 18px 22px; text-align: center;
  margin-bottom: 14px; box-shadow: 0 8px 30px rgba(10, 18, 40, .18);
}
.hero-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #D7DFF3; }
.phase-tag { background: rgba(255, 233, 196, .22); color: #FFE9C4; border-radius: 999px; padding: 3px 11px; }
.monster-wrap { width: 190px; height: 168px; margin: 4px auto 0; }
.monster-svg { width: 100%; height: 100%; display: block; animation: breathe 3s ease-in-out infinite; }
.hero-title { font-size: 21px; font-weight: 600; letter-spacing: .5px; margin: 4px 0 7px; }
.hero-sub { font-size: 13px; color: #DCE3F4; margin: 0 0 10px; }
.monster-line { font-size: 12px; color: #FFE9C4; line-height: 1.65; margin: 0; }

.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big-btn {
  height: 88px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .20); cursor: pointer;
  background: linear-gradient(135deg, #FFE0B6, #F7BE90); color: #3A2A20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  box-shadow: 0 6px 18px rgba(20, 30, 60, .20); transition: transform .12s ease;
}
.big-btn:active { transform: scale(.98); }
.big-btn.done { background: rgba(255, 255, 255, .14); color: #F7F3EA; border: 1px dashed rgba(255, 255, 255, .40); box-shadow: none; }
.big-ic { width: 22px; height: 22px; }
.big-label { font-size: 16px; font-weight: 600; }
.big-sub { font-size: 11px; opacity: .82; }
.row-note { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #E6EAF7; padding: 9px 4px 14px; }
.link-btn { background: none; border: 0; color: #FFE0B6; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
.danger-link { color: #D7A6A6; display: block; margin-top: 12px; }
.undo-bar {
  display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 12px; padding: 11px 14px;
  background: rgba(255, 233, 196, .16); border: 1px solid rgba(255, 233, 196, .40);
  border-radius: 14px; color: #FFE9C4; font-size: 12.5px; text-align: left; cursor: pointer;
}
.undo-bar .ic { width: 15px; height: 15px; }
.undo-bar:active { transform: scale(.99); }
/* 常驻「改记录」入口：比即时撤回条更低调，但四个页签始终可见 */
.fix-bar {
  display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 12px; padding: 9px 14px;
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 12px; color: #D7DDEE; font-size: 12px; text-align: left; cursor: pointer;
}
.fix-bar .ic { width: 14px; height: 14px; color: #CBB8E8; flex: none; }
.fix-bar > span:not(.fix-arrow) { flex: 1; }
.fix-arrow { color: #C9C0E0; font-size: 18px; line-height: 1; flex: none; }
.fix-bar:active { background: rgba(255, 255, 255, .12); }
/* 选一夜列表 */
.fix-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; margin-bottom: 8px;
  background: #FFFCF7; border: 1px solid #EDE6F3; border-radius: 12px; color: #3A3555; font-size: 13px; cursor: pointer; text-align: left; }
.fix-row > span:first-child { flex: 1; white-space: nowrap; }
.fix-row small { font-size: 11px; color: #8A8CA0; white-space: nowrap; }
.fix-row .fix-arrow { color: #9A86C4; }
/* 编辑弹层：时间输入 + 清空 */
.edit-line { display: flex; align-items: center; gap: 8px; }
.edit-line .field { flex: 1; min-width: 0; margin-bottom: 12px; }
.mini-clear { flex: none; background: #F1ECF7; border: 1px solid #E3DAEE; color: #6C5A8E; border-radius: 10px;
  font-size: 12px; padding: 8px 10px; cursor: pointer; margin-bottom: 12px; white-space: nowrap; }
.mini-clear:active { background: #E7DDF3; }
/* 夜记卡片里的「改这一夜」 */
.night-edit { margin-left: auto; background: none; border: 0; color: #7A6BA8; font-size: 11px; cursor: pointer; padding: 2px 0; white-space: nowrap; }
/* 帮助卡 */
.help-item { padding: 8px 0; border-bottom: 1px solid #F0ECF4; }
.help-item:last-child { border-bottom: 0; }
.help-item b { display: block; font-size: 13px; color: #3A3555; margin-bottom: 2px; }
.help-item span { font-size: 12px; color: #787D91; line-height: 1.6; }

/* 卡片 */
.card { background: #FFF8EE; color: #2C3550; border-radius: 20px; padding: 16px 16px 15px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(14, 22, 48, .18); }
.card-head { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.card-head .ic { width: 17px; height: 17px; color: #7A6BA8; }
.card-head-r { margin-left: auto; font-size: 11px; font-weight: 400; color: #7C728F; background: #F1ECF7; padding: 3px 9px; border-radius: 999px; }
.card-foot { font-size: 11.5px; color: #787D91; line-height: 1.65; margin: 8px 0 0; }
.quest-text { font-size: 16px; line-height: 1.6; font-weight: 600; color: #3A3555; margin: 4px 0 12px; }
.btn-primary { border: 0; border-radius: 14px; background: linear-gradient(135deg, #FFD9A8, #F4B489); color: #3A2A20; font-size: 14px; font-weight: 600; padding: 12px 16px; cursor: pointer; transition: transform .12s ease; }
.btn-primary:active { transform: scale(.98); }
.btn-primary.wide { width: 100%; }
.btn-ghost { background: #F1ECF7; color: #4A4066; border: 1px solid #E3DAEE; border-radius: 14px; padding: 11px 16px; font-size: 14px; cursor: pointer; }
.done-line { display: flex; align-items: center; gap: 7px; color: #4E6C5D; font-size: 13px; background: #EAF3EC; border-radius: 12px; padding: 10px 12px; }
.coin-num { font-size: 34px; font-weight: 700; color: #4A4066; line-height: 1.1; }
.coin-num span { font-size: 14px; font-weight: 400; color: #8A8CA0; }
.coin-today { display: inline-block; margin-top: 10px; font-size: 11px; color: #6C6089; background: #F1ECF7; border-radius: 999px; padding: 4px 10px; }
.room-line { font-size: 15px; line-height: 1.7; color: #4A4066; margin: 2px 0 0; }
.trace-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #E3E8F7; background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .14); border-radius: 16px; padding: 12px 14px; }
.trace-line.on { background: rgba(255, 233, 196, .16); }
.trace-line .ic { width: 16px; height: 16px; color: #FFE0B6; }
.trace-total { margin-left: auto; color: #FFE9C4; white-space: nowrap; }
.section-title { display: flex; align-items: center; justify-content: space-between; color: #F7F3EA; font-size: 14px; font-weight: 600; margin: 18px 4px 10px; }
.sum-num { font-size: 28px; font-weight: 700; color: #4A4066; }
.sum-num span { font-size: 13px; font-weight: 400; color: #8A8CA0; }
.dots { display: flex; gap: 6px; margin-top: 12px; }
.dot { flex: 1; height: 12px; border-radius: 6px; background: #E9E5EE; }
.dot.on { background: linear-gradient(135deg, #FFD9A8, #C7B6E8); }
.dots-cap { font-size: 11px; color: #8A8CA0; margin: 6px 0 0; }
.empty-card { text-align: center; padding: 26px 18px; }
.empty-ic { width: 34px; height: 34px; color: #9A8FB8; }
.empty-card p { font-size: 13px; color: #6E7285; line-height: 1.7; margin: 10px 0 0; }
.night-card { padding: 14px 15px; }
.night-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.night-date { font-size: 14px; font-weight: 600; color: #3A3555; }
.night-tag { font-size: 11px; color: #6C6089; background: #F1ECF7; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.night-times { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: #555A70; }
.night-times span { display: flex; align-items: center; gap: 5px; }
.night-times .ic { width: 14px; height: 14px; color: #8A7BB0; }
.night-quest { font-size: 12px; color: #6E7285; margin: 9px 0 0; }
.night-foot { display: flex; gap: 10px; font-size: 11px; color: #9A8FB8; margin-top: 9px; }
.list-end { text-align: center; font-size: 11px; color: #D5DDF0; }

.frag-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
.frag { aspect-ratio: 1; border-radius: 12px; background: #F0ECF4; display: flex; align-items: center; justify-content: center; color: #A9A2B8; font-size: 11px; }
.frag.on { background: linear-gradient(135deg, #FFE2B8, #C7B6E8); color: #5B4A7A; }
.frag-ic { width: 18px; height: 18px; }
.unlock-card { padding: 13px 15px; }
.unlock-top { display: flex; align-items: center; gap: 10px; }
.unlock-ic { width: 34px; height: 34px; border-radius: 11px; background: #F1ECF7; color: #7A6BA8; display: flex; align-items: center; justify-content: center; flex: none; }
.unlock-name { flex: 1; min-width: 0; }
.unlock-name b { display: block; font-size: 14px; color: #3A3555; }
.unlock-name small { display: block; font-size: 11px; color: #8A8CA0; margin-top: 2px; }
.unlock-state { font-size: 11px; color: #8A8CA0; white-space: nowrap; }
.unlock-state.got { color: #4E6C5D; background: #EAF3EC; border-radius: 999px; padding: 3px 9px; }
.bar { height: 6px; border-radius: 6px; background: #F0ECF4; margin-top: 11px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #FFD9A8, #C7B6E8); }
.btn-small { background: #F1ECF7; color: #5B4A7A; border: 1px solid #E3DAEE; border-radius: 11px; padding: 7px 12px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; }
.btn-small .ic { width: 14px; height: 14px; }
.btn-small.using { background: #EAF3EC; color: #4E6C5D; border-color: #D7E8DC; }
.badge-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #F0ECF4; }
.badge-row:last-of-type { border-bottom: 0; }
.badge-row > .ic { width: 20px; height: 20px; color: #B8B0C6; }
.badge-row.got > .ic { color: #C79A5B; }
.badge-row > div { flex: 1; min-width: 0; }
.badge-row b { display: block; font-size: 13px; color: #3A3555; }
.badge-row.got b { color: #7A5C34; }
.badge-row small { display: block; font-size: 11px; color: #8A8CA0; margin-top: 2px; line-height: 1.5; }
.badge-row > span { font-size: 11px; color: #A9A2B8; white-space: nowrap; }
.badge-row.got > span { color: #4E6C5D; }
.reward-row, .voucher-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F0ECF4; }
.reward-row > div, .voucher-row > div { flex: 1; min-width: 0; }
.reward-row b, .voucher-row b { display: block; font-size: 13px; color: #3A3555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reward-row small, .voucher-row small { display: block; font-size: 11px; color: #8A8CA0; margin-top: 2px; }
.reward-row .btn-small, .voucher-row .btn-small { margin-top: 0; }
.got-tag { font-size: 11px; color: #4E6C5D; background: #EAF3EC; border-radius: 999px; padding: 4px 9px; }
.wait-tag { font-size: 11px; color: #8A8CA0; white-space: nowrap; }
.reward-form { display: flex; gap: 7px; align-items: center; margin-top: 12px; }
.reward-form .field { margin: 0; flex: 1; min-width: 0; }
.reward-form .field-sm { flex: none; }
.reward-form .btn-small { margin-top: 0; white-space: nowrap; }

/* 表单 */
.field { width: 100%; border: 1px solid #E2DCEC; background: #FFFCF7; color: #2C3550; border-radius: 12px; padding: 11px 12px; font-size: 14px; margin: 0 0 12px; }
.field:focus { outline: 2px solid #C7B6E8; outline-offset: 1px; }
.field-label { display: block; font-size: 12px; color: #787D91; margin: 0 0 6px; }
.field-sm { width: 82px; }
.hint { font-size: 12px; color: #787D91; line-height: 1.65; margin: 4px 0 0; }
.switch-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #3A3555; margin-bottom: 12px; }
.switch-row input { width: 20px; height: 20px; accent-color: #9A86C4; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn-ghost { flex: 1; }
.privacy { text-align: center; color: #C9D2E8; font-size: 11px; line-height: 1.9; margin: 18px 0 4px; }
.voucher-text { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.9; background: #FFFCF7; border: 1px solid #E2DCEC; border-radius: 12px; padding: 12px; color: #3A3555; margin: 0; }

/* 底部页签 */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(18, 29, 55, .90); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255, 255, 255, .12); padding-bottom: env(safe-area-inset-bottom);
}
.tab { background: none; border: 0; color: #AEB9D6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 62px; font-size: 11px; cursor: pointer; }
.tab.active { color: #FFE0B6; }
.tab-svg { width: 21px; height: 21px; }

/* 弹层与提示 */
#modalRoot.hidden { display: none; }
.modal-root { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-mask { position: absolute; inset: 0; background: rgba(10, 16, 35, .60); backdrop-filter: blur(4px); }
.modal { position: relative; width: 100%; max-width: 400px; max-height: 80vh; overflow: auto; background: #FFF8EE; color: #2C3550; border-radius: 22px; padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .30); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.modal-head h3 { font-size: 16px; margin: 0; }
.icon-btn { background: none; border: 0; color: #787D91; cursor: pointer; padding: 4px; }
.icon-btn .ic { width: 18px; height: 18px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px);
  background: rgba(20, 30, 58, .94); color: #F7F3EA; font-size: 13px; padding: 10px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
  white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 360px) {
  .hero-title { font-size: 19px; }
  .monster-wrap { width: 165px; height: 148px; }
  .big-btn { height: 80px; }
  .frag-grid { gap: 5px; }
  .night-times { gap: 10px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body class="theme-dawn">
<div class="sky" aria-hidden="true">
  <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
  <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
  <span class="star s7"></span><span class="star s8"></span>
</div>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span>星眠小站</span></div>
    <div class="topbar-right" id="topbarRight"></div>
  </header>
  <main id="main" class="main"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today" type="button"><span class="tab-ic" id="tabIcToday"></span><span>今晚</span></button>
    <button class="tab" data-tab="log" type="button"><span class="tab-ic" id="tabIcLog"></span><span>夜记</span></button>
    <button class="tab" data-tab="collection" type="button"><span class="tab-ic" id="tabIcCollection"></span><span>小铺</span></button>
    <button class="tab" data-tab="settings" type="button"><span class="tab-ic" id="tabIcSettings"></span><span>我的</span></button>
  </nav>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot" class="hidden"></div>
<script>
/* 星眠小站 · 文案与素材层（window 级常量，供 app.js 使用） */

var ICONS = {
  moon: '<path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8 8.6 8.6 0 1 0 20.2 14.6Z"/><path d="M17.5 4.5v3M16 6h3"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 14h3M8 17.5h6"/>',

<script>
/* 星眠小站 · 逻辑层（所有记录只存在本机 localStorage，不上传、不联网） */
(function () {
  'use strict';

  var KEY = 'xingmian_v1';
  var APP_VER = 'v2 · 11-13';
  var TABS = ['today', 'log', 'collection', 'settings'];
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var HOUR = 3600 * 1000;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function dateObj(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = dateObj(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diffDays(a, b) {
    var x = dateObj(a), y = dateObj(b);
    return Math.round((Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()) - Date.UTC(y.getFullYear(), y.getMonth(), y.getDate())) / 86400000);
  }
  function mondayOf(s) { return addDays(s, -((dateObj(s).getDay() + 6) % 7)); }
  function md(s) { var p = String(s).split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; }
  function wd(s) { return WD[dateObj(s).getDay()]; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function el(id) { return document.getElementById(id); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function hm(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function minOf(hhmm) { var p = String(hhmm || '00:00').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function cutMin() { return minOf(state.settings.dayCut); }

  /* ---------- 数据 ---------- */
  function blank() {
    return {
      v: 1, created: todayStr(),
      settings: { bedTarget: '23:00', wakeTarget: '07:00', dayCut: '04:00', roommateOn: true, roommate: '阿月', theme: 'dawn' },
      nights: {}, coins: 0, coinLog: [], fragments: [], stickers: [], skins: ['sk_dawn'],
      rewards: [], contract: null, vouchers: [], badges: [], roomSeen: {}, undo: null
    };
  }
  function normalize(o) {
    var b = blank();
    if (!o || typeof o !== 'object') return b;
    o.v = 1;
    o.created = o.created || b.created;
    var s = {};
    Object.keys(b.settings).forEach(function (k) { s[k] = b.settings[k]; });
    if (o.settings && typeof o.settings === 'object') Object.keys(o.settings).forEach(function (k) { s[k] = o.settings[k]; });
    o.settings = s;
    if (!o.nights || typeof o.nights !== 'object') o.nights = {};
    if (!o.roomSeen || typeof o.roomSeen !== 'object') o.roomSeen = {};
    ['coinLog', 'fragments', 'stickers', 'skins', 'rewards', 'vouchers', 'badges'].forEach(function (k) {
      if (!Array.isArray(o[k])) o[k] = b[k].slice();
    });
    if (!o.skins.length) o.skins = ['sk_dawn'];
    if (typeof o.coins !== 'number' || o.coins < 0) o.coins = 0;
    if (!o.contract || typeof o.contract !== 'object') o.contract = null;
    if (!o.undo || typeof o.undo !== 'object' || !o.undo.data) o.undo = null;
    Object.keys(o.nights).forEach(function (k) {
      var n = o.nights[k] || {};
      if (typeof n !== 'object') n = {};
      ['sleepTs', 'wakeTs'].forEach(function (f) { if (typeof n[f] !== 'number') n[f] = null; });
      ['sleepHM', 'wakeHM', 'questId'].forEach(function (f) { if (typeof n[f] !== 'string') n[f] = ''; });
      if (typeof n.questDone !== 'boolean') n.questDone = false;
      if (typeof n.coins !== 'number') n.coins = 0;
      if (typeof n.manual !== 'boolean') n.manual = false;
      o.nights[k] = n;
    });
    return o;
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      return normalize(raw ? JSON.parse(raw) : null);
    } catch (e) { return blank(); }
  }
  var state = load();
  var curTab = (function () { var h = location.hash.replace('#', ''); return TABS.indexOf(h) >= 0 ? h : 'today'; })();
  var toastTimer = null;

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { toast('记录没能保存，请检查浏览器存储设置'); return false; }
  }

  /* ---------- 点错了也能撤回 ---------- */
  function snapshot(label) {
    var copy = JSON.parse(JSON.stringify(state));
    delete copy.undo;
    state.undo = { label: label, at: Date.now(), data: copy };
  }
  function doUndo() {
    if (!state.undo || !state.undo.data) { toast('目前没有可以撤回的操作'); return; }
    var label = state.undo.label, d = state.undo.data;
    d.undo = null;
    state = normalize(d);
    save(); closeModal(); renderAll();
    toast('已经撤回「' + label + '」');
  }
  function hasBackup() {
    try { return !!localStorage.getItem(KEY + '_backup'); } catch (e) { return false; }
  }
  function restoreBackup() {
    try {
      var raw = localStorage.getItem(KEY + '_backup');
      if (!raw) { toast('没有找到备份'); return; }
      var d = JSON.parse(raw);
      d.undo = null;
      state = normalize(d);
      save(); renderAll(); toast('清空前的记录找回来了');
    } catch (e) { toast('备份读不出来'); }
  }

  /* ---------- 归日：跨午夜必须落在同一个「夜」 ---------- */
  function nightKeyOf(d) {
    var k = new Date(d instanceof Date ? d.getTime() : d);
    if (k.getHours() * 60 + k.getMinutes() < cutMin()) k.setDate(k.getDate() - 1);
    return ymd(k);
  }
  /* 当前所处的「夜」：04:00 → 次日 04:00 算同一夜 */
  function activeNightKey() { return nightKeyOf(new Date()); }
  /* 最近 14 夜圆点的结尾：夜里看今晚，白天看刚结束的那一夜 */
  function dotsAnchor() { return phase() === 'night' ? activeNightKey() : addDays(activeNightKey(), -1); }
  function openNightKey() {
    var now = Date.now(), best = null, bestTs = -1;
    Object.keys(state.nights).forEach(function (k) {
      var n = state.nights[k];
      if (n.sleepTs && !n.wakeTs && now - n.sleepTs >= 0 && now - n.sleepTs <= 20 * HOUR && n.sleepTs > bestTs) {
        best = k; bestTs = n.sleepTs;
      }
    });
    return best;
  }
  /* 今天的操作要挂在哪一条夜记录上：夜里归今晚，晨/昼归刚结束的那一夜 */
  function currentNightKey() {
    var o = openNightKey();
    if (o) return o;
    if (phase() === 'night') return activeNightKey();
    var now = Date.now(), best = null, bestTs = -1;
    Object.keys(state.nights).forEach(function (k) {
      var n = state.nights[k];
      if (n.wakeTs && now - n.wakeTs >= 0 && now - n.wakeTs <= 14 * HOUR && n.wakeTs > bestTs) {
        best = k; bestTs = n.wakeTs;
      }
    });
    return best || dotsAnchor();
  }
  function tsSleepFrom(k, hhmm) {
    var m = minOf(hhmm), day = m < cutMin() ? addDays(k, 1) : k;
    var d = dateObj(day); d.setHours(Math.floor(m / 60), m % 60, 0, 0);
    return d.getTime();
  }
  function tsWakeFrom(k, hhmm) {
    var m = minOf(hhmm), d = dateObj(addDays(k, 1));
    d.setHours(Math.floor(m / 60), m % 60, 0, 0);
    return d.getTime();
  }

  /* ---------- 记录与派生 ---------- */
  function getNight(k) { return state.nights[k] || null; }
  function ensureNight(k) {
    if (!state.nights[k]) state.nights[k] = { sleepTs: null, wakeTs: null, sleepHM: '', wakeHM: '', questId: '', questDone: false, coins: 0, manual: false };
    return state.nights[k];
  }
  function traced(n) { return !!n && (!!n.sleepTs || !!n.wakeTs || !!n.questDone || n.coins > 0 || !!n.manual); }
  function totalTraced() { var c = 0; Object.keys(state.nights).forEach(function (k) { if (traced(state.nights[k])) c++; }); return c; }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function questOf(k) { return QUESTS[hashStr('quest|' + k) % QUESTS.length]; }
  function roomLineOf(k, who) {
    var pool = ROOMLINES[who] || ROOMLINES['阿月'];
    return pool[hashStr('room|' + who + '|' + k) % pool.length];
  }
  function addCoin(k, reason) {
    var dup = state.coinLog.some(function (x) { return x.k === k && x.r === reason; });
    if (dup) return false;
    state.coinLog.push({ k: k, r: reason });
    state.coins += 1;
    ensureNight(k).coins += 1;
    return true;
  }
  function calcPass(n) {
    if (!n.sleepTs || !n.wakeTs) return null;
    var cut = cutMin(), bed = minOf(state.settings.bedTarget), wake = minOf(state.settings.wakeTarget);
    var bedRef = bed < cut ? bed + 1440 : bed;
    var sm = minOf(n.sleepHM), sleepRef = sm < cut ? sm + 1440 : sm;
    return sleepRef <= bedRef && minOf(n.wakeHM) <= wake;
  }
  function passLabel(n) {
    if (n.manual) return '补记的一夜';
    var p = calcPass(n);
    if (p === true) return '今晚刚好赶上';
    if (p === false) return '今晚晚了一点，也记下了';
    return '已记下';
  }
  function moodOf(n) {
    if (!n.sleepTs) return 'curl';
    var cut = cutMin(), bed = minOf(state.settings.bedTarget);
    var bedRef = bed < cut ? bed + 1440 : bed;
    var sm = minOf(n.sleepHM), sleepRef = sm < cut ? sm + 1440 : sm;
    var late = sleepRef - bedRef;
    if (late <= 0) return 'curl';
    if (late <= 90) return 'yawn';
    return 'company';
  }
  function phase() {
    var cut = cutMin(), bed = minOf(state.settings.bedTarget), wake = minOf(state.settings.wakeTarget);
    var bedRef = bed < cut ? bed + 1440 : bed;
    var nightStart = Math.max(0, Math.min(1440, bedRef - 180));
    var morningStart = Math.max(0, wake - 120);
    var morningEnd = Math.min(1440, wake + 180);
    var d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    if (m >= nightStart || m < morningStart) return 'night';
    if (m < morningEnd) return 'morning';
    return 'day';
  }
  function addBadge(id) { if (state.badges.indexOf(id) < 0) state.badges.push(id); }
  function syncUnlocks() {
    var nights = totalTraced();
    UNLOCKS.forEach(function (u) {
      var have = (u.metric === 'coins' ? state.coins : nights) >= u.need;
      var arr = u.cat === 'skin' ? state.skins : state.stickers;
      if (have && arr.indexOf(u.id) < 0) arr.push(u.id);
    });
    if (nights >= 1) addBadge('first_night');
    if (nights >= 21) addBadge('city_champion_local');
    var weeks = {};
    Object.keys(state.nights).forEach(function (k) {
      if (traced(state.nights[k])) { var w = mondayOf(k); weeks[w] = (weeks[w] || 0) + 1; }
    });
    if (Object.keys(weeks).some(function (w) { return weeks[w] >= 5; })) addBadge('week_five');
  }
  function applyTheme() { document.body.className = 'theme-' + (state.settings.theme || 'dawn'); }

  /* ---------- 操作 ---------- */
  function doSleep() {
    var k = currentNightKey(), n = ensureNight(k);
    if (n.sleepTs) { toast('这一夜已经记下啦 · ' + n.sleepHM); return; }
    snapshot('记下入睡时间');
    n.sleepTs = Date.now(); n.sleepHM = hm(n.sleepTs);
    addCoin(k, 'sleep'); syncUnlocks(); save(); renderAll();
    toast('已记下 · ' + n.sleepHM + '，晚安');
  }
  function doWake() {
    var open = openNightKey();
    var k = open || activeNightKey(), n = ensureNight(k);
    if (n.wakeTs) { toast('今早已经记下啦 · ' + n.wakeHM); return; }
    snapshot('记下醒来时间');
    n.wakeTs = Date.now(); n.wakeHM = hm(n.wakeTs);
    addCoin(k, 'wake'); syncUnlocks(); save(); renderAll();
    toast('早，光已经进来了 · ' + n.wakeHM);
  }
  function doQuest() {
    var k = currentNightKey(), n = ensureNight(k);
    if (n.questDone) { toast('这一片已经收下啦'); return; }
    snapshot('收下睡眠碎片');
    var q = questOf(k);
    n.questId = q.id; n.questDone = true;
    if (state.fragments.indexOf(q.id) < 0) state.fragments.push(q.id);
    addCoin(k, 'quest'); syncUnlocks(); save(); renderAll();
    toast('收下一片睡眠碎片');
  }

      + (n.questDone ? '<label class="switch-row"><span>收下睡眠碎片「' + esc(q.text) + '」</span>'
        + '<input type="checkbox" id="mQuest" checked></label>' : '')
      + '<p class="hint">取消勾选＝撤下这次碎片。已经攒下的梦境币、贴纸、皮肤只加不减，改这些不会扣掉。</p>';
    var foot = '<button class="btn-ghost" data-act="delNight" data-id="' + esc(k) + '" type="button">删掉这一整夜</button>'
      + '<button class="btn-primary" data-act="saveNight" data-k="' + esc(k) + '" type="button">记下</button>';
    openModal('改这一夜', body, foot);
  }
  function saveNight(k) {
    snapshot('改这一夜');
    var n = ensureNight(k), sv = el('mSleep').value, wv = el('mWake').value, mq = el('mQuest');
    if (sv) { n.sleepTs = tsSleepFrom(k, sv); n.sleepHM = sv; }
    else { n.sleepTs = null; n.sleepHM = ''; }
    if (wv) { n.wakeTs = tsWakeFrom(k, wv); n.wakeHM = wv; }
    else { n.wakeTs = null; n.wakeHM = ''; }
    if (mq && !mq.checked) { n.questDone = false; n.questId = ''; }
    if (!traced(n)) delete state.nights[k];
    syncUnlocks(); save(); closeModal(); renderAll(); toast('改好了，顶部还能再撤回');
  }
  function delNight(k) {
    if (state.nights[k]) {
      snapshot('删掉这一整夜');
      delete state.nights[k];
      syncUnlocks(); save(); closeModal(); renderAll(); toast('这一夜删掉了，顶部还能撤回');
    } else { closeModal(); }
  }
  function openFixModal() {
    var keys = Object.keys(state.nights).filter(function (k) { return traced(state.nights[k]); }).sort().reverse();
    var body = '<p class="hint">点错了不用慌，这里没有惩罚。选一夜就能改时间、取消碎片，或删掉整夜；清空全部也有备份。改完任意一步，页面顶部都会出现「撤回」。</p>';
    if (!keys.length) body += '<p class="hint">目前还没有夜记录，去「今晚」点一下就有啦。</p>';
    keys.slice(0, 30).forEach(function (k) {
      var n = state.nights[k];
      body += '<button class="fix-row" data-act="editNight" data-id="' + esc(k) + '" type="button">'
        + '<span>' + esc(md(k)) + ' · ' + esc(wd(k)) + '</span>'
        + '<small>' + esc((n.sleepHM || '—') + ' → ' + (n.wakeHM || '—')) + '</small>'
        + '<span class="fix-arrow">›</span></button>';
    });
    var foot = '<button class="btn-ghost" data-act="closeModal" type="button">先不改</button>';
    openModal('改记录 · 选一夜', body, foot);
  }
  function addBackModal() {
    var yesterday = addDays(activeNightKey(), -1);
    var body = '<label class="field-label">这一夜的日期（入睡那天）</label><input class="field" id="bDate" type="date" value="' + esc(yesterday) + '">'
      + '<label class="field-label">入睡时间</label><input class="field" id="bSleep" type="time" value="23:10">'
      + '<label class="field-label">醒来时间</label><input class="field" id="bWake" type="time" value="07:05">'
      + '<p class="hint">补记只留一段痕迹，不额外计梦境币，也不影响今天。</p>';
    var foot = '<button class="btn-ghost" data-act="closeModal" type="button">取消</button>'
      + '<button class="btn-primary" data-act="saveBack" type="button">补上</button>';
    openModal('补记一夜', body, foot);
  }
  function saveBack() {
    var k = el('bDate').value;
    if (!k) { toast('先选一个日期'); return; }
    snapshot('补记一夜');
    var n = ensureNight(k), sv = el('bSleep').value, wv = el('bWake').value;
    n.manual = true;
    if (sv) { n.sleepTs = tsSleepFrom(k, sv); n.sleepHM = sv; }
    if (wv) { n.wakeTs = tsWakeFrom(k, wv); n.wakeHM = wv; }
    syncUnlocks(); save(); closeModal(); renderAll(); toast('补上了，这一夜留下来了');
  }
  function genVoucher() {
    snapshot('生成一句话契约');
    var c = state.contract || {};
    c.stake = el('stakeInput').value.trim();
    c.witness = el('witnessInput').value.trim();
    c.created = todayStr();
    state.contract = c;
    var text = contractText({ date: todayStr(), bed: state.settings.bedTarget, wake: state.settings.wakeTarget, stake: c.stake, witness: c.witness });
    var v = { id: 'v' + Date.now(), nightKey: activeNightKey(), text: text, created: todayStr() };
    state.vouchers.push(v);
    save();
    var body = '<pre class="voucher-text" id="voucherText">' + esc(text) + '</pre>'
      + '<p class="hint">可以复制下来发给自己，或写在便签上。</p>';
    var foot = '<button class="btn-ghost" data-act="closeModal" type="button">收好</button>'
      + '<button class="btn-primary" data-act="copyVoucher" type="button">复制文字</button>';
    openModal('一句话契约', body, foot);
  }
  function viewVoucher(id) {
    var v = state.vouchers.filter(function (x) { return x.id === id; })[0];
    if (!v) return;
    var body = '<pre class="voucher-text" id="voucherText">' + esc(v.text) + '</pre>';
    var foot = '<button class="btn-ghost" data-act="closeModal" type="button">收好</button>'
      + '<button class="btn-primary" data-act="copyVoucher" type="button">复制文字</button>';
    openModal('留档的凭证', body, foot);
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast('已复制'); }, function () { fallbackCopy(t); });
    } else fallbackCopy(t);
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('长按文字也能复制'); }
    document.body.removeChild(ta);
  }
  function exportData() {
    try {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = '星眠小站-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('已导出');
    } catch (e) { toast('导出没成功，可以试试导入导出之外的备份方式'); }
  }
  function clearConfirmModal() {
    var body = '<p class="hint">会先自动留一份本机备份。清空后随时能一键撤回，或在「我的」里找回备份，不会真的丢。</p>';
    var foot = '<button class="btn-ghost" data-act="closeModal" type="button">再想想</button>'
      + '<button class="btn-primary" data-act="clearAll" type="button">确定清空</button>';
    openModal('要清空全部记录吗？', body, foot);
  }

  /* ---------- 路由与总渲染 ---------- */
  function go(tab) {
    if (TABS.indexOf(tab) < 0) tab = 'today';
    curTab = tab;
    try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; }
    renderAll();
  }
  function renderAll() {
    syncUnlocks();
    applyTheme();
    Object.keys(TAB_ICONS).forEach(function (t) {
      var e = el('tabIc' + cap(t));
      if (e) e.innerHTML = svg(TAB_ICONS[t], 'tab-svg');
    });
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === curTab);
    el('topbarRight').textContent = md(todayStr()) + ' · ' + wd(todayStr());
    var main = el('main');
    var bars = state.undo
      ? '<button class="undo-bar" data-act="undo" type="button">' + svg('undo', 'ic')
        + '<span>点错了？撤回上一步「' + esc(state.undo.label) + '」</span></button>'
      : '';
    /* 常驻入口：四个页签都在，不依赖「刚操作过」，随时能改任意一夜 */
    bars += '<button class="fix-bar" data-act="openFix" type="button">' + svg('edit', 'ic')
      + '<span>改记录 · 点错了随时能改</span><span class="fix-arrow">›</span></button>';
    main.innerHTML = bars + (curTab === 'today' ? renderToday()
      : curTab === 'log' ? renderLog()
      : curTab === 'collection' ? renderCollection() : renderSettings());
    main.classList.remove('fade-in');
    void main.offsetWidth;
    main.classList.add('fade-in');
    try { window.scrollTo(0, 0); } catch (e) { /* noop */ }
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (e) {
    var tabBtn = e.target.closest ? e.target.closest('[data-tab]') : null;
    if (tabBtn) { go(tabBtn.getAttribute('data-tab')); return; }
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var id = btn.getAttribute('data-id');
    switch (act) {
      case 'sleep': doSleep(); break;
      case 'wake': doWake(); break;
      case 'quest': doQuest(); break;
      case 'editNight': editNightModal(id); break;
      case 'openFix': openFixModal(); break;
      case 'saveNight': saveNight(btn.getAttribute('data-k')); break;
      case 'delNight': delNight(id); break;
      case 'clearField':
        var cf = el(btn.getAttribute('data-field'));
        if (cf) { cf.value = ''; toast('已清空，点「记下」生效'); }
        break;
      case 'addBack': addBackModal(); break;
      case 'saveBack': saveBack(); break;
      case 'genVoucher': genVoucher(); break;
      case 'viewVoucher': viewVoucher(id); break;
      case 'copyVoucher': copyText(el('voucherText') ? el('voucherText').textContent : ''); break;
      case 'closeModal': closeModal(); break;
      case 'undo': doUndo(); break;
      case 'restoreBackup': restoreBackup(); break;
      case 'useSkin':
        snapshot('换主题');
        state.settings.theme = SKIN_CLASS[id] || 'dawn';
        save(); renderAll(); toast('换好啦'); break;
      case 'addReward':
        var rt = el('rewardText').value.trim();
        var rn = parseInt(el('rewardNeed').value, 10);
        if (!rt) { toast('先写一句想给自己的话'); break; }
        if (!rn || rn < 1) rn = 10;
        snapshot('加一张奖励券');
        state.rewards.push({ id: 'r' + Date.now(), text: rt, need: rn, redeemed: false });
        save(); renderAll(); toast('奖励券加好了'); break;
      case 'redeem':
        snapshot('领奖励券');
        state.rewards.forEach(function (r) { if (r.id === id && state.coins >= r.need) r.redeemed = true; });
        save(); renderAll(); toast('领好啦，记得真的去用'); break;
      case 'export': exportData(); break;
      case 'import': el('importFile').click(); break;
      case 'clearConfirm': clearConfirmModal(); break;
      case 'clearAll':
        var old = JSON.parse(JSON.stringify(state));
        delete old.undo;
        try { localStorage.setItem(KEY + '_backup', JSON.stringify(old)); } catch (err) { /* noop */ }
        state = blank();
        state.undo = { label: '清空全部记录', at: Date.now(), data: old };
        save(); closeModal(); go('today'); toast('已经清空，随时可以撤回'); break;
      default: break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'importFile') {
      var f = t.files && t.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var o = JSON.parse(reader.result);
          if (!o || typeof o !== 'object' || !o.nights) throw new Error('bad');
          snapshot('导入记录');
          var keptUndo = state.undo;
          state = normalize(o);
          state.undo = keptUndo;
          save(); renderAll(); toast('导入好了');
        } catch (err) { toast('这个文件读不出来，换一个试试'); }
      };
      reader.readAsText(f);
      t.value = '';
      return;
    }
    if (!t.getAttribute) return;
    var key = t.getAttribute('data-set');
    if (!key) return;
    state.settings[key] = t.type === 'checkbox' ? t.checked : t.value;
    save(); renderAll();
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    var live = t.getAttribute('data-live');
    if (!live) return;
    if (!state.contract) state.contract = { stake: '', witness: '', created: todayStr() };
    state.contract[live] = t.value;
    save();
  });

  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    var t = TABS.indexOf(h) >= 0 ? h : 'today';
    if (t !== curTab) { curTab = t; renderAll(); }
  });

  /* 本地自检用的只读入口（不影响界面，方便验证跨午夜归日） */
  window.__xm = {
    nightKeyOf: nightKeyOf,
    activeNightKey: activeNightKey,
    currentNightKey: currentNightKey,
    questOf: questOf,
    roomLineOf: roomLineOf
  };

  renderAll();
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="哄它睡">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>哄它睡 · 陪它一起睡</title>
<style>
/* 哄它睡 · 夜色渐晨 */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: #F7F3EA;
  background: linear-gradient(180deg, #16233F 0%, #2B3B63 38%, #6E6C9B 68%, #F3C9A0 88%, #FBE3C4 100%) fixed;
}
body.theme-deepnight { background: linear-gradient(180deg, #0E1730 0%, #1E2B4D 55%, #33436E 100%) fixed; }
body.theme-mist     { background: linear-gradient(180deg, #1E2148 0%, #4A4475 45%, #9C8FB5 75%, #E8D8D5 100%) fixed; }
body.theme-warm     { background: linear-gradient(180deg, #2B2748 0%, #6B5570 45%, #C98E7A 78%, #F6D7AE 100%) fixed; }
button, input, select { font-family: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.sky { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #FFF3D8; opacity: .65; animation: twinkle 5s ease-in-out infinite; }
.s1 { top: 9%; left: 14%; } .s2 { top: 17%; left: 62%; animation-delay: 1.1s; }
.s3 { top: 6%; left: 84%; animation-delay: 2.2s; } .s4 { top: 28%; left: 31%; animation-delay: .7s; }
.s5 { top: 34%; left: 91%; animation-delay: 1.8s; } .s6 { top: 43%; left: 8%; animation-delay: 3s; }
.s7 { top: 12%; left: 43%; animation-delay: 2.6s; } .s8 { top: 51%; left: 74%; animation-delay: 1.4s; }
.hero-moon { position: absolute; top: 48px; left: 20px; width: 30px; height: 30px; opacity: .82; filter: drop-shadow(0 0 12px rgba(255, 236, 197, .50)); }

.shell { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 14px) 18px 12px;
  background: rgba(17, 27, 52, .30); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #FFDCA9; box-shadow: 0 0 12px #FFDCA9; }
.topbar-right { font-size: 12px; color: #D5DDF0; }
.main { padding: 12px 16px calc(100px + env(safe-area-inset-bottom)); }

.ic { width: 16px; height: 16px; display: inline-block; vertical-align: middle; flex: none; }
.fade-in { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes twinkle { 0%, 100% { opacity: .28; } 50% { opacity: .85; } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

/* 主视觉 */
.hero {
  position: relative;
  background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .18);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 24px; padding: 16px 18px 22px; text-align: center;
  margin-bottom: 14px; box-shadow: 0 8px 30px rgba(10, 18, 40, .18);
}
.hero-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #D7DFF3; }
.phase-tag { background: rgba(255, 233, 196, .22); color: #FFE9C4; border-radius: 999px; padding: 3px 11px; }
.pet-photo-wrap { width: 190px; height: 190px; margin: 4px auto 0; border-radius: 24px; overflow: hidden;
  border: 1px solid rgba(255,255,255,.22); box-shadow: 0 8px 26px rgba(10,18,40,.28); }
.pet-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.pet-photo-wrap.is-sleepy .pet-photo { filter: saturate(.55) brightness(.82); }
.pet-switch { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 12px 0 8px; }
.pet-chip { border: 1px solid rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .08); color: #E6EAF7;
  border-radius: 999px; padding: 4px 11px; font-size: 11px; cursor: pointer; }
.pet-chip.on { background: #FFE9C4; color: #5A4636; border-color: #FFE9C4; }
.pet-chip:active { transform: scale(.97); }
.pet-switch.light .pet-chip { border-color: #E3DAEE; background: #F1ECF7; color: #5B4A7A; }
.pet-switch.light .pet-chip.on { background: #FFE9C4; color: #5A4636; border-color: #FFE9C4; }
.hero-title { font-size: 21px; font-weight: 600; letter-spacing: .5px; margin: 4px 0 7px; }
.hero-sub { font-size: 13px; color: #DCE3F4; margin: 0 0 10px; }
.monster-line { font-size: 12px; color: #FFE9C4; line-height: 1.65; margin: 0; }

.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big-btn {
  height: 88px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .20); cursor: pointer;
  background: linear-gradient(135deg, #FFE0B6, #F7BE90); color: #3A2A20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  box-shadow: 0 6px 18px rgba(20, 30, 60, .20); transition: transform .12s ease;
}
.big-btn:active { transform: scale(.98); }
.big-btn.done { background: rgba(255, 255, 255, .14); color: #F7F3EA; border: 1px dashed rgba(255, 255, 255, .40); box-shadow: none; cursor: default; }
.big-btn.solo { grid-column: 1 / -1; height: 94px; }
.big-ic { width: 22px; height: 22px; }
.big-label { font-size: 16px; font-weight: 600; }
.big-sub { font-size: 11px; opacity: .82; }
.row-note { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #E6EAF7; padding: 9px 4px 14px; }
.link-btn { background: none; border: 0; color: #FFE0B6; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
.danger-link { color: #D7A6A6; display: block; margin-top: 12px; }

/* 卡片 */
.card { background: #FFF8EE; color: #2C3550; border-radius: 20px; padding: 16px 16px 15px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(14, 22, 48, .18); }
.card-head { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.card-head .ic { width: 17px; height: 17px; color: #7A6BA8; }
.card-head-r { margin-left: auto; font-size: 11px; font-weight: 400; color: #7C728F; background: #F1ECF7; padding: 3px 9px; border-radius: 999px; }
.card-foot { font-size: 11.5px; color: #787D91; line-height: 1.65; margin: 8px 0 0; }
.btn-primary { border: 0; border-radius: 14px; background: linear-gradient(135deg, #FFD9A8, #F4B489); color: #3A2A20; font-size: 14px; font-weight: 600; padding: 12px 16px; cursor: pointer; transition: transform .12s ease; }
.btn-primary:active { transform: scale(.98); }
.btn-primary.wide { width: 100%; }
.btn-ghost { background: #F1ECF7; color: #4A4066; border: 1px solid #E3DAEE; border-radius: 14px; padding: 11px 16px; font-size: 14px; cursor: pointer; }
.room-line { font-size: 15px; line-height: 1.7; color: #4A4066; margin: 2px 0 0; }
.section-title { display: flex; align-items: center; justify-content: space-between; color: #F7F3EA; font-size: 14px; font-weight: 600; margin: 18px 4px 10px; }
.empty-card { text-align: center; padding: 26px 18px; }
.empty-ic { width: 34px; height: 34px; color: #9A8FB8; }
.empty-card p { font-size: 13px; color: #6E7285; line-height: 1.7; margin: 10px 0 0; }
.night-card { padding: 14px 15px; }
.night-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.night-date { font-size: 14px; font-weight: 600; color: #3A3555; }
.night-tag { font-size: 11px; color: #6C6089; background: #F1ECF7; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.night-times { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: #555A70; }
.night-times span { display: flex; align-items: center; gap: 5px; }
.night-times .ic { width: 14px; height: 14px; color: #8A7BB0; }
.night-foot { display: flex; gap: 10px; font-size: 11px; color: #9A8FB8; margin-top: 9px; align-items: center; }
.list-end { text-align: center; font-size: 11px; color: #D5DDF0; }
.night-edit { margin-left: auto; background: none; border: 0; color: #7A6BA8; font-size: 11px; cursor: pointer; padding: 2px 0; white-space: nowrap; }

.btn-small { background: #F1ECF7; color: #5B4A7A; border: 1px solid #E3DAEE; border-radius: 11px; padding: 7px 12px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; }
.btn-small .ic { width: 14px; height: 14px; }
.btn-small.using { background: #EAF3EC; color: #4E6C5D; border-color: #D7E8DC; }
.reward-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F0ECF4; }
.reward-row > div { flex: 1; min-width: 0; }
.reward-row b { display: block; font-size: 13px; color: #3A3555; }
.reward-row small { display: block; font-size: 11px; color: #8A8CA0; margin-top: 2px; }
.reward-row .btn-small { margin-top: 0; }
.got-tag { font-size: 11px; color: #4E6C5D; background: #EAF3EC; border-radius: 999px; padding: 4px 9px; }

/* 表单 */
.field { width: 100%; border: 1px solid #E2DCEC; background: #FFFCF7; color: #2C3550; border-radius: 12px; padding: 11px 12px; font-size: 14px; margin: 0 0 12px; }
.field:focus { outline: 2px solid #C7B6E8; outline-offset: 1px; }
.field-label { display: block; font-size: 12px; color: #787D91; margin: 0 0 6px; }
.hint { font-size: 12px; color: #787D91; line-height: 1.65; margin: 4px 0 0; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn-ghost { flex: 1; }
.privacy { text-align: center; color: #C9D2E8; font-size: 11px; line-height: 1.9; margin: 18px 0 4px; }

/* 底部页签 */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(18, 29, 55, .90); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255, 255, 255, .12); padding-bottom: env(safe-area-inset-bottom);
}
.tab { background: none; border: 0; color: #AEB9D6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 62px; font-size: 11px; cursor: pointer; }
.tab.active { color: #FFE0B6; }
.tab-svg { width: 21px; height: 21px; }

/* 弹层与提示 */
#modalRoot.hidden { display: none; }
.modal-root { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-mask { position: absolute; inset: 0; background: rgba(10, 16, 35, .60); backdrop-filter: blur(4px); }
.modal { position: relative; width: 100%; max-width: 400px; max-height: 80vh; overflow: auto; background: #FFF8EE; color: #2C3550; border-radius: 22px; padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .30); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.modal-head h3 { font-size: 16px; margin: 0; }
.icon-btn { background: none; border: 0; color: #787D91; cursor: pointer; padding: 4px; }
.icon-btn .ic { width: 18px; height: 18px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px);
  background: rgba(20, 30, 58, .94); color: #F7F3EA; font-size: 13px; padding: 10px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
  white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 哄它睡之后的熄屏遮罩 */
.sleep-veil {
  position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
  background: rgba(12, 19, 40, .94); color: #FFE9C4; font-size: 18px;
  transition: background 1.6s ease;
}
.sleep-veil.show { display: flex; }
.sleep-veil.dark { background: #05070D; }
.sleep-veil small { font-size: 12px; color: #B9C4DC; line-height: 1.7; }

@media (max-width: 360px) {
  .hero-title { font-size: 19px; }
  .pet-photo-wrap { width: 165px; height: 165px; }
  .big-btn { height: 80px; }
  .night-times { gap: 10px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body class="theme-dawn">
<div class="sky" aria-hidden="true">
  <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
  <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
  <span class="star s7"></span><span class="star s8"></span>
</div>
<div class="sleep-veil" id="sleepVeil" role="button" tabindex="0" aria-label="点一下回到页面">
  <div id="veilText">它睡着了。<br>把手机放下吧。</div>

</div>
<div class="shell">

    <div class="topbar-right" id="topbarRight"></div>
  </header>
  <main id="main" class="main"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today" type="button"><span class="tab-ic" id="tabIcToday"></span><span>今晚</span></button>
    <button class="tab" data-tab="log" type="button"><span class="tab-ic" id="tabIcLog"></span><span>夜记</span></button>
    <button class="tab" data-tab="collection" type="button"><span class="tab-ic" id="tabIcCollection"></span><span>小窝</span></button>
    <button class="tab" data-tab="settings" type="button"><span class="tab-ic" id="tabIcSettings"></span><span>我的</span></button>
  </nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* 素材层：沿用原站的星空与温和怪兽 */
var ICONS = {
  moon: '<path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8 8.6 8.6 0 1 0 20.2 14.6Z"/><path d="M17.5 4.5v3M16 6h3"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 14h3M8 17.5h6"/>',
  heart: '<path d="M12 20s-7.5-4.7-7.5-9.3A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.7C19.5 15.3 12 20 12 20Z"/>',
  sliders: '<path d="M3 7h9M16.5 7H21M3 17h3.5M11 17h10"/><circle cx="14" cy="7" r="2.4"/><circle cx="8.5" cy="17" r="2.4"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/>',
  edit: '<path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  download: '<path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 19h16"/>',
  leaf: '<path d="M20 4C10 4 5 8.5 5 15a5 5 0 0 0 5 5c6.5 0 11-5 10-16Z"/><path d="M4 20c3-5 7-8 12-10"/>'
};
function svg(name, cls) {
  return '<svg class="' + (cls || 'ic') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}
var TAB_ICONS = { today: 'moon', log: 'calendar', collection: 'heart', settings: 'sliders' };
var MOON_SVG = '<svg class="hero-moon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
  + '<defs><mask id="xmMoonMask"><rect width="60" height="60" fill="#000"/>'
  + '<circle cx="30" cy="30" r="24" fill="#fff"/><circle cx="42" cy="21" r="21" fill="#000"/></mask></defs>'
  + '<rect width="60" height="60" fill="#FFF0CC" mask="url(#xmMoonMask)"/></svg>';

var PET_LINES = {
  company: { tag: '它醒着', title: '它还醒着，等你忙完', sub: '到了它先困的点，不用你记着。', line: '什么时候来都可以，我在这儿待着。' },
  yawn:    { tag: '它困了', title: '它开始打哈欠了',     sub: '轮到你送它去睡啦。',           line: '它揉了揉眼睛，被子已经铺好了。' },
  curl:    { tag: '已睡着', title: '它已经蜷成一小团睡着了', sub: '今晚这一下，已经记下了。',   line: '呼吸很轻，星星盖到下巴。' },
  sleepy:  { tag: '有点蔫', title: '它昨晚等你到挺晚',   sub: '今天看起来有点没精神。',       line: '我眯了一会，眼睛还没完全睁开。' }
};
var THEMES = [
  { id: 'dawn',      name: '夜色渐晨' },
  { id: 'deepnight', name: '深夜蓝' },
  { id: 'mist',      name: '薄雾紫' },
  { id: 'warm',      name: '暖橘晚风' }
];

var PETS = [
  { id: 'cat',    name: '小猫' },
  { id: 'dog',    name: '小狗' },
  { id: 'rabbit', name: '小兔' },
  { id: 'hamster', name: '小仓鼠' }
];

/* 真实宠物照片：醒着 / 睡着两张；"有点蔫"复用醒着那张并加低饱和滤镜 */
function petPhoto(petId, mood) {
  var id = PETS.some(function (p) { return p.id === petId; }) ? petId : 'cat';
  var asleep = (mood === 'curl');
  var sleepy = (mood === 'sleepy');
  var name = (PETS.filter(function (p) { return p.id === id; })[0] || PETS[0]).name;
  return '<div class="pet-photo-wrap' + (sleepy ? ' is-sleepy' : '') + '">'
    + '<img class="pet-photo" src="pets/' + id + '-' + (asleep ? 'sleep' : 'awake') + '.jpg" alt="' + name + '">'
    + '</div>';
}
</script>
<script>
/* 逻辑层：新键存储，旧键只读备份，不覆盖 */
(function () {
  'use strict';

  var KEY = 'star_sleep_pet_v1';
  var OLD_KEY = 'xingmian_v1';
  var BACKUP_KEY = 'xingmian_v1_backup';

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function dateObj(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = dateObj(s); d.setDate(d.getDate() + n); return ymd(d); }
  function md(s) { var p = String(s).split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; }
  function wd(s) { return WD[dateObj(s).getDay()]; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function el(id) { return document.getElementById(id); }
  function hm(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function minOf(hhmm) { var p = String(hhmm || '00:00').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function nightKeyOf(ts) { var d = new Date(ts); if (d.getHours() < 4) d.setDate(d.getDate() - 1); return ymd(d); }

  function fresh() { return { v: 1, name: '小眠', pet: 'cat', tuckTime: '22:30', theme: 'dawn', nights: {} }; }

  function isOnTime(ts, target) {
    var d = new Date(ts), m = d.getHours() * 60 + d.getMinutes();
    if (d.getHours() < 12) m += 24 * 60;
    return m <= minOf(target || state.tuckTime);
  }

  /* 旧数据只读：先整份备份，再挑出有用的时间写进新键；旧键永不写入 */
  function migrate() {
    var data = fresh();
    try {
      var oldRaw = localStorage.getItem(OLD_KEY);
      if (oldRaw) {
        if (!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, oldRaw);
        var old = JSON.parse(oldRaw);
        if (old.settings && old.settings.bedTarget) data.tuckTime = old.settings.bedTarget;
        Object.keys(old.nights || {}).forEach(function (k) {
          var n = old.nights[k] || {};
          var ts = 0;
          if (typeof n.sleepTs === 'number') ts = n.sleepTs;
          else if (n.sleepHM) ts = dateObj(k).getTime() + minOf(n.sleepHM) * 60000;
          if (ts) data.nights[k] = { tuckedAt: ts, onTime: isOnTime(ts, data.tuckTime) };
        });
      }
    } catch (e) { /* 迁移失败也不影响新工具使用 */ }
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    return data;
  }

  function normalize(o) {
    var b = fresh();
    if (!o || typeof o !== 'object') return b;
    o.name = typeof o.name === 'string' && o.name.trim() ? o.name.slice(0, 12) : b.name;
    if (o.pet === 'bear') o.pet = 'hamster';
    o.pet = PETS.some(function (p) { return p.id === o.pet; }) ? o.pet : b.pet;
    o.tuckTime = /^\d{1,2}:\d{2}$/.test(o.tuckTime) ? o.tuckTime : b.tuckTime;
    o.theme = THEMES.some(function (t) { return t.id === o.theme; }) ? o.theme : b.theme;
    if (!o.nights || typeof o.nights !== 'object' || Array.isArray(o.nights)) o.nights = {};
    Object.keys(o.nights).forEach(function (k) {
      var n = o.nights[k];
      if (!n || typeof n.tuckedAt !== 'number') delete o.nights[k];
      else {
        n.onTime = !!n.onTime;
        if (n.manual) n.manual = !!n.manual;
      }
    });
    return o;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      return normalize(raw ? JSON.parse(raw) : migrate());
    } catch (e) { return fresh(); }
  }

  var state = load();
  var curTab = (function () { var h = location.hash.replace('#', ''); return TABS.indexOf(h) >= 0 ? h : 'today'; })();
  var toastTimer = null;

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { toast('记录没能保存，请检查浏览器存储设置'); return false; }
  }
  function applyTheme() { document.body.className = 'theme-' + state.theme; }

  function moodOf() {
    var k = nightKeyOf(Date.now()), n = state.nights[k];
    if (n && n.tuckedAt) return 'curl';
    /* 只在早上（4-11点）检查"昨晚那一夜"有没有哄，没哄就"有点蔫"；
       睡前（中午后）绝不出现，避免增加入睡负担 */
    var hr = new Date().getHours();
    if (hr >= 4 && hr < 12) {
      var lastNight = addDays(todayStr(), -1);
      var ln = state.nights[lastNight];
      if (!ln || !ln.tuckedAt) return 'sleepy';
    }
    if (nowMin() >= minOf(state.tuckTime)) return 'yawn';
    return 'company';
  }

  /* ---------- 今晚 ---------- */
  function renderToday() {
    var k = nightKeyOf(Date.now()), n = state.nights[k];
    var mood = moodOf(), L = PET_LINES[mood];
    var h = [];
    h.push('<div class="hero fade-in">' + MOON_SVG);
    h.push('<div class="hero-top"><span class="phase-tag">' + L.tag + '</span><span class="hero-date">' + md(k) + ' · ' + wd(k) + '</span></div>');
    h.push(petPhoto(state.pet, mood));
    h.push('<div class="pet-switch">');
    PETS.forEach(function (p) {
      h.push('<button class="pet-chip' + (state.pet === p.id ? ' on' : '') + '" data-act="pet" data-id="' + p.id + '" type="button">' + p.name + '</button>');
    });
    h.push('</div>');
    h.push('<h1 class="hero-title">' + esc(L.title) + '</h1>');
    h.push('<p class="hero-sub">' + esc(state.name) + ' · ' + esc(L.sub) + '</p>');
    h.push('<p class="monster-line">' + esc(L.line) + '</p>');
    h.push('</div>');
    h.push('<div class="action-row">');
    if (mood === 'sleepy') {
      h.push('<button class="big-btn solo" type="button" data-act="sleepyTip">' + svg('moon', 'big-ic')
        + '<span class="big-label">今晚早点回来</span><span class="big-sub">哄一哄，它就精神了</span></button>');
    } else if (n && n.tuckedAt) {
      h.push('<button class="big-btn solo done" type="button" disabled><span class="big-label">今晚已经送它睡了</span>'
        + '<span class="big-sub">' + hm(n.tuckedAt) + (n.onTime ? ' · 按时' : ' · 晚一点也没关系') + '</span></button>');
    } else {
      h.push('<button class="big-btn solo" type="button" data-act="tuck">' + svg('moon', 'big-ic')
        + '<span class="big-label">哄它睡</span><span class="big-sub">点一下就好，不用别的</span></button>');
    }
    h.push('</div>');
    h.push('<div class="row-note"><span>没有扣分，断一天它也在。</span>'
      + '<button class="link-btn" data-act="goLog" type="button">去夜记</button></div>');
    h.push('<div class="card"><div class="card-head">' + svg('leaf', 'ic') + '这一下做了什么</div>'
      + '<p class="room-line" style="font-size:13px">记下你送它睡的时间，然后屏幕会慢慢暗下去，提醒你放下手机。'
      + '误触了点一下就回来，不会留下一笔。</p></div>');
    return h.join('');
  }

  /* ---------- 夜记 ---------- */
  function chartSvg() {
    var days = [], target = minOf(state.tuckTime), i, k, n, dt, mins, rec;
    for (i = 9; i >= 0; i--) {
      k = addDays(todayStr(), -i);
      n = state.nights[k];
      rec = null;
      if (n && n.tuckedAt) {
        dt = new Date(n.tuckedAt);
        mins = dt.getHours() * 60 + dt.getMinutes();
        if (dt.getHours() < 12) mins += 24 * 60;
        rec = { mins: mins, hm: hm(n.tuckedAt), onTime: mins <= target };
      }
      days.push({ key: k, label: (+k.split('-')[2]), rec: rec });
    }
    var W = 340, H = 200, L = 32, R = 8, T = 22, B = 30;
    var pw = W - L - R, ph = H - T - B, minT = 1200, maxT = 1560;
    function yOf(m) { return T + (Math.min(maxT, Math.max(minT, m)) - minT) / (maxT - minT) * ph; }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="最近十夜送它睡的时间">';
    [[1200, '20:00'], [1320, '22:00'], [1440, '00:00'], [1560, '02:00']].forEach(function (g) {
      var yy = yOf(g[0]);
      s += '<line x1="' + L + '" y1="' + yy + '" x2="' + (W - R) + '" y2="' + yy + '" stroke="#E6E0EC" stroke-width="1"/>'
        + '<text x="' + (L - 5) + '" y="' + (yy + 3) + '" text-anchor="end" font-size="10" fill="#9A8FB8">' + g[1] + '</text>';
    });
    var ty = yOf(target);
    s += '<line x1="' + L + '" y1="' + ty + '" x2="' + (W - R) + '" y2="' + ty + '" stroke="#D9A45C" stroke-width="1.2" stroke-dasharray="4 3"/>'
      + '<text x="' + (W - R) + '" y="' + (ty - 6) + '" text-anchor="end" font-size="9.5" fill="#B5843F">它困了 ' + esc(state.tuckTime) + '</text>';
    var step = pw / days.length, bw = Math.min(15, step - 10);
    days.forEach(function (d, idx) {
      var cx = L + step * idx + step / 2;
      s += '<text x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle" font-size="10" fill="#8A8CA0">' + d.label + '</text>';
      if (!d.rec) {
        s += '<line x1="' + cx + '" y1="' + (T + 6) + '" x2="' + cx + '" y2="' + (H - B) + '" stroke="#EFE9F1" stroke-width="2"/>';
      } else {
        var yy = yOf(d.rec.mins), color = d.rec.onTime ? '#E9B36E' : '#B3A2D6';
        s += '<rect x="' + (cx - bw / 2) + '" y="' + yy + '" width="' + bw + '" height="' + ((H - B) - yy) + '" rx="4" fill="' + color + '" opacity=".92"/>'
          + '<circle cx="' + cx + '" cy="' + yy + '" r="3.2" fill="' + (d.rec.onTime ? '#C98A3E' : '#8B76BC') + '"/>'
          + '<text x="' + cx + '" y="' + Math.max(12, yy - 8) + '" text-anchor="middle" font-size="9" fill="#5B4A7A">' + d.rec.hm + '</text>';
      }
      s += '<rect x="' + (cx - step / 2) + '" y="' + T + '" width="' + step + '" height="' + (H - B - T) + '" fill="transparent"'
        + ' data-act="' + (d.rec ? 'editNight' : 'addBackOn') + '" data-id="' + d.key + '" style="cursor:pointer"/>';
    });
    return s + '</svg>';
  }

  function renderLog() {
    var h = [];
    h.push('<div class="card fade-in"><div class="card-head">' + svg('calendar', 'ic') + '夜记</div>'
      + '<p class="room-line" style="font-size:13px">这里只记你几点送它睡。没有评分，没有连续天数，'
      + '断一天它还是等你。</p></div>');
    h.push('<div class="card"><div class="card-head">' + svg('clock', 'ic') + '最近十夜'
      + '<span class="card-head-r">点柱子能改</span></div>' + chartSvg()
      + '<p class="card-foot">虚线是它困的时间。灰色细线那一夜没记，不算断。'
      + '柱子越高，代表你越早送它睡。</p></div>');
    h.push('<div class="section-title">补一笔 <button class="link-btn" data-act="addBack" type="button">补记一夜</button></div>');
    return h.join('');
  }

  /* ---------- 小窝 ---------- */
  function renderCollection() {
    var h = [];
    h.push('<div class="card fade-in"><div class="card-head">' + svg('heart', 'ic') + '今晚谁陪你</div>'
      + '<p class="room-line" style="font-size:13px">小猫、小狗、小兔、小仓鼠，想换就换。'
      + '不加任务、不加积分。</p>'
      + '<div class="pet-switch light" style="margin:10px 0 0">');
    PETS.forEach(function (p) {
      h.push('<button class="pet-chip' + (state.pet === p.id ? ' on' : '') + '" data-act="pet" data-id="' + p.id + '" type="button">' + p.name + '</button>');
    });
    h.push('</div></div>');
    h.push('<div class="card"><div class="card-head">' + svg('moon', 'ic') + '夜色</div>');
    THEMES.forEach(function (t) {
      var using = state.theme === t.id;
      h.push('<div class="reward-row"><div><b>' + esc(t.name) + '</b><small>'
        + (using ? '正在用' : '点一下换上') + '</small></div>'
        + (using ? '<span class="got-tag">使用中</span>'
                 : '<button class="btn-small" data-act="theme" data-id="' + t.id + '" type="button">换上</button>')
        + '</div>');
    });
    h.push('</div>');
    return h.join('');
  }

  /* ---------- 我的 ---------- */
  function renderSettings() {
    var migrated = false;
    try { migrated = !!localStorage.getItem(BACKUP_KEY); } catch (e) {}
    var h = [];
    h.push('<div class="card fade-in"><div class="card-head">' + svg('sliders', 'ic') + '一点点设置</div>');
    h.push('<label class="field-label" for="petName">它叫什么</label>'
      + '<input class="field" id="petName" data-act="name" maxlength="12" value="' + esc(state.name) + '">');
    h.push('<label class="field-label" for="tuckTime">它几点困</label>'
      + '<input class="field" id="tuckTime" data-act="tuckTime" type="time" value="' + esc(state.tuckTime) + '">');
    h.push('<p class="hint">到了这个点，它会先打哈欠。没到也没关系，你提前送它睡照样记。</p></div>');

    h.push('<div class="card"><div class="card-head">' + svg('clock', 'ic') + '记录</div>');
    h.push('<p class="hint">所有记录只存在这台设备的浏览器里，不上传、不联网。'
      + '想留一份，可以导出来。</p>');
    h.push('<div class="btn-row"><button class="btn-ghost" data-act="export" type="button">导出记录</button>'
      + '<button class="btn-ghost" data-act="clearAsk" type="button">清空记录</button></div>');
    if (migrated) h.push('<p class="hint" style="margin-top:12px">旧版记录已整份备份，原数据没有被改动。</p>');
    h.push('</div>');
    h.push('<p class="privacy">哄它睡 · 陪它一起睡<br>断一天不算断，明天它还在。</p>');
    return h.join('');
  }

  function renderAll() {
    el('topbarRight').textContent = '陪 ' + state.name;
    var map = { today: renderToday, log: renderLog, collection: renderCollection, settings: renderSettings };
    el('main').innerHTML = (map[curTab] || renderToday)();
    Object.keys(TAB_ICONS).forEach(function (t) {
      var node = el('tabIc' + t.charAt(0).toUpperCase() + t.slice(1));
      if (node) node.innerHTML = svg(TAB_ICONS[t], 'tab-svg');
    });
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === curTab);
    }
    applyTheme();
  }

  function go(tab) {
    if (TABS.indexOf(tab) < 0) return;
    curTab = tab;
    if (location.hash !== '#' + tab) location.hash = tab;
    renderAll();
    window.scrollTo(0, 0);
  }

  /* ---------- 弹层 ---------- */
  function openModal(title, body, foot) {
    var root = el('modalRoot');
    root.className = 'modal-root';
    root.innerHTML = '<div class="modal-mask" data-act="closeModal"></div><div class="modal">'
      + '<div class="modal-head"><h3>' + esc(title) + '</h3>'
      + '<button class="icon-btn" data-act="closeModal" type="button" aria-label="关闭">' + svg('close', 'ic') + '</button></div>'
      + body + '<div class="modal-foot">' + foot + '</div></div>';
  }
  function closeModal() { var root = el('modalRoot'); root.className = 'hidden'; root.innerHTML = ''; }

  function editNightModal(k) {
    var n = state.nights[k];
    if (!n) return;
    openModal('改这一夜', '<label class="field-label" for="editTime">' + md(k) + ' · 送它睡的时间</label>'
      + '<input class="field" id="editTime" type="time" value="' + hm(n.tuckedAt) + '">'
      + '<p class="hint">改完还是好好记着，不会有惩罚。</p>',
      '<button class="btn-small" data-act="delNight" data-id="' + esc(k) + '" type="button">清掉这一笔</button>'
      + '<button class="btn-primary" data-act="saveNight" data-id="' + esc(k) + '" type="button">保存</button>');
  }
  function addBackModal(date) {
    openModal('补记一夜', '<label class="field-label" for="backDate">哪一夜</label>'
      + '<input class="field" id="backDate" type="date" value="' + esc(date || todayStr()) + '">'
      + '<label class="field-label" for="backTime">几点送它睡</label>'
      + '<input class="field" id="backTime" type="time" value="22:30">'
      + '<p class="hint">想补就补，改错了也能再改。</p>',
      '<button class="btn-ghost" data-act="closeModal" type="button">算了</button>'
      + '<button class="btn-primary" data-act="saveBack" type="button">补上</button>');
  }
  function clearAskModal() {
    openModal('清空记录', '<p class="hint" style="font-size:13px">会清掉这台设备上的陪睡记录，'
      + '旧版备份不受影响。清完就空了，想清楚再点。</p>',
      '<button class="btn-ghost" data-act="closeModal" type="button">不清了</button>'
      + '<button class="btn-primary" data-act="clearYes" type="button">确认清空</button>');
  }

  function startVeil() {
    var v = el('sleepVeil');
    v.className = 'sleep-veil show';
    setTimeout(function () { v.classList.add('dark'); }, 1400);
  }
  function hideVeil() { el('sleepVeil').className = 'sleep-veil'; }

  document.addEventListener('click', function (e) {
    var tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { go(tabBtn.getAttribute('data-tab')); return; }
    var t = e.target.closest('[data-act]');
    if (!t) {
      if (e.target.closest('#sleepVeil')) hideVeil();
      return;
    }
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (a === 'tuck') {
      var k = nightKeyOf(Date.now()), ts = Date.now();
      state.nights[k] = { tuckedAt: ts, onTime: isOnTime(ts), manual: false };
      if (save()) { renderAll(); startVeil(); }
    } else if (a === 'sleepyTip') {
      toast('今晚早点回来哄它，它就好啦');
    } else if (a === 'goLog') {
      go('log');
    } else if (a === 'pet') {
      state.pet = id; save(); renderAll(); toast('换好啦');
    } else if (a === 'theme') {
      state.theme = id; save(); renderAll(); toast('换好啦');
    } else if (a === 'addBack') {
      addBackModal();
    } else if (a === 'addBackOn') {
      addBackModal(id);
    } else if (a === 'editNight') {
      editNightModal(id);
    } else if (a === 'saveNight') {
      var inp = el('editTime');
      if (!inp || !inp.value) { toast('先选个时间'); return; }
      var rec = state.nights[id];
      var parts = inp.value.split(':');
      var d = dateObj(id); d.setHours(+parts[0], +parts[1], 0, 0);
      rec.tuckedAt = d.getTime();
      rec.onTime = isOnTime(rec.tuckedAt); rec.manual = true;
      save(); closeModal(); renderAll(); toast('改好了');
    } else if (a === 'delNight') {
      delete state.nights[id]; save(); closeModal(); renderAll(); toast('这一笔清掉了');
    } else if (a === 'saveBack') {
      var date = el('backDate').value, time = el('backTime').value;
      if (!date || !time) { toast('日期和时间都要填'); return; }
      var p = time.split(':'), dd = dateObj(date); dd.setHours(+p[0], +p[1], 0, 0);
      var kk = nightKeyOf(dd.getTime());
      state.nights[kk] = { tuckedAt: dd.getTime(), onTime: isOnTime(dd.getTime()), manual: true };
      save(); closeModal(); renderAll(); toast('补上了');
    } else if (a === 'clearAsk') {
      clearAskModal();
    } else if (a === 'clearYes') {
      state.nights = {}; save(); closeModal(); renderAll(); toast('清空了');
    } else if (a === 'export') {
      try {
        var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob), link = document.createElement('a');
        link.href = url; link.download = '陪它睡-记录-' + todayStr() + '.json';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      } catch (e) { toast('导出失败'); }
    } else if (a === 'closeModal') {
      closeModal();
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target, a = t.getAttribute && t.getAttribute('data-act');
    if (a === 'name') {
      state.name = (t.value || '小眠').trim().slice(0, 12) || '小眠';
      save(); renderAll(); toast('记住啦');
    } else if (a === 'tuckTime') {
      if (/^\d{1,2}:\d{2}$/.test(t.value)) { state.tuckTime = t.value; save(); toast('到点它会先困'); }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); hideVeil(); }
  });
  el('sleepVeil').addEventListener('click', hideVeil);
  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    curTab = TABS.indexOf(h) >= 0 ? h : 'today';
    renderAll();
  });

  applyTheme();
  renderAll();
})();
</script>
</body>
</html>
